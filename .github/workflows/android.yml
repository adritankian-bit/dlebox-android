name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validar catálogo
        run: |
          python3 scripts/validate_catalog.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Compilar y probar
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Preparar APK de prueba
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          APK_NAME="DleBox-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: DleBox-debug
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
      - name: Publicar versión de prueba
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME}" = "v${APP_VERSION}"
          NOTES="docs/RELEASE-${GITHUB_REF_NAME}.md"
          test -f "$NOTES"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_NAME" "$APK_NAME.sha256" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES" --prerelease
          else
            gh release create "$GITHUB_REF_NAME" "$APK_NAME" "$APK_NAME.sha256" --title "DleBox ${GITHUB_REF_NAME} · prueba" --notes-file "$NOTES" --prerelease --verify-tag
          fi
