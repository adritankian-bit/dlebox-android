name: Actualizar catálogo CC0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Importar fuente y comprobar destinos
        run: |
          python3 scripts/import_cc0.py --fetch-source --verify
          python3 scripts/validate_catalog.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Publicar únicamente datos validados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/
          git diff --cached --quiet && exit 0
          git commit -m 'Update verified CC0 catalog'
          git push
