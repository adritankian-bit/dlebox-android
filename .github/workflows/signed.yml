name: APK con firma estable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar con secretos de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.DLEBOX_KEYSTORE_BASE64 }}
          DLEBOX_KEYSTORE: ${{ runner.temp }}/dlebox.jks
          DLEBOX_STORE_PASSWORD: ${{ secrets.DLEBOX_STORE_PASSWORD }}
          DLEBOX_KEY_ALIAS: ${{ secrets.DLEBOX_KEY_ALIAS }}
          DLEBOX_KEY_PASSWORD: ${{ secrets.DLEBOX_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          trap 'rm -f "$DLEBOX_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$DLEBOX_KEYSTORE"
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DleBox-signed
          path: app/build/outputs/apk/release/app-release.apk
